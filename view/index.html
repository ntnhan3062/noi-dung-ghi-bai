<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nội dung ghi bài - Xem</title>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var isGithub = l.hostname.indexOf('github.io') !== -1;
        var repoName = '';
        if (isGithub) {
          var segments = pathname.split('/').filter(Boolean);
          if (segments.length > 0) {
            repoName = '/' + segments[0];
          }
        }
        var search = l.search ? ('&' + l.search.slice(1)) : '';
        var target = l.protocol + '//' + l.host + repoName + '/?p=' + encodeURIComponent('/view') + search + l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body style="background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; color: #64748b;">
      <p style="font-weight: 600; font-size: 1.1rem; color: #4f46e5;">Đang tải ứng dụng...</p>
    </div>
  </body>
</html>
